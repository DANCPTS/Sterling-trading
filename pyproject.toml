[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sterling"
version = "0.2.0"
description = "Offline simulated GBP ledger, desk rules, and Stage 2 Gate 1 risk contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sterling.rules" = ["data/*.json"]
"sterling.risk" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 132
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sterling"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sterling"]
mypy_path = "src"
warn_unused_ignores = true
