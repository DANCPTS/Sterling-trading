# Disabled template. This file is NOT in the public repo's .github/workflows.
# GitHub will not run it here. Copy it into a private repo only after SETUP.md.
# The job is also forced off with `if: false`.
name: weekly-forward-decision
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 16 * * 1"
permissions:
  contents: none
concurrency:
  group: weekly-forward-decision
  cancel-in-progress: false
jobs:
  decide:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Decide
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: python scripts/run_weekly_decision.py --provider mock --log evidence/forward.jsonl
      - name: Verify
        run: python deploy/private-runner/verify_from_log.py --log evidence/forward.jsonl
      - name: Commit evidence
        run: |
          git add evidence
          git diff --cached --quiet || git commit -m "Record the weekly forward log"
          git push
